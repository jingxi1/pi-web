# pi-web — 本地构建开发用
# 构建并启动：docker compose -f docker-compose.build.yml up -d --build
# 注意：在 macOS arm64 上构建 amd64 镜像需要 Docker Desktop/OrbStack + buildx
#
# 数据目录会在首次启动时自动创建：
#   ./data/pi-agent  — pi agent 数据（会话、模型配置、notify.json）
#   ./workspace      — 代码工作区

services:
  pi-web:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: pi-web-dev
    ports:
      - "30141:30141"
    volumes:
      - ./data/pi-agent:/data/pi-agent
      - ./workspace:/workspace
    env_file:
      # 注入 .env.local（MINIMAX_CN_API_KEY 等）—— token-plan 接口需要
      - .env.local
    environment:
      # GIT_REPO_URL: "https://github.com/your/repo.git"
      - PI_CODING_AGENT_DIR=/data/pi-agent
      - PORT=30141
      - HOSTNAME=0.0.0.0
      # Docker Desktop injects host proxy vars into every container — force the
      # correct one (matching what build-arg HTTP_PROXY used). Without this,
      # the Next.js process inside the container can't reach api.minimaxi.com
      # for the minimax-cn token-plan quota, etc.
      - HTTP_PROXY=http://192.168.9.186:7890
      - HTTPS_PROXY=http://192.168.9.186:7890
      - http_proxy=http://192.168.9.186:7890
      - https_proxy=http://192.168.9.186:7890
      - NO_PROXY=localhost,127.0.0.1
      - no_proxy=localhost,127.0.0.1
    restart: unless-stopped
